bundle:
  name: agent_langgraph_advanced
  engine: direct

resources:
  apps:
    agent_langgraph_advanced:
      name: "test-workshop-app"
      description: "LangGraph agent application with short-term and long-term memory"
      source_code_path: ./
      config:
        command: ["uv", "run", "start-app"]
        env:
          - name: MLFLOW_TRACKING_URI
            value: "databricks"
          - name: MLFLOW_REGISTRY_URI
            value: "databricks-uc"
          - name: API_PROXY
            value: "http://localhost:8000/invocations"
          - name: CHAT_APP_PORT
            value: "3000"
          - name: CHAT_PROXY_TIMEOUT_SECONDS
            value: "300"
          - name: MLFLOW_EXPERIMENT_ID
            value_from: "experiment"
          - name: LAKEBASE_AUTOSCALING_ENDPOINT
            value_from: "postgres"
          # Managed Memory (long-term) and Managed Sessions (short-term) stores, via databricks-mason.
          # Create them and grant the app SP access with: uv run setup-agent-stores --app <app-name>
          - name: AGENT_MEMORY_STORE
            value: "agent-langgraph-advanced-memory"
          - name: AGENT_SESSION_STORE
            value: "agent-langgraph-advanced-sessions"

      # Resources which this app has access to
      resources:
        - name: 'experiment'
          experiment:
            experiment_id: "3075609125705777"
            permission: 'CAN_MANAGE'
        - name: 'postgres'
          postgres:
            branch: "projects/test-workshop-lakebase/branches/test-workshop-lakebase-branch"
            database: "projects/test-workshop-lakebase/branches/test-workshop-lakebase-branch/databases/databricks-postgres"
            permission: 'CAN_CONNECT_AND_CREATE'

targets:
  dev:
    mode: development
    default: true
    # workspace:
    #   host: https://...

  prod:
    mode: production
    # workspace:
    #   host: https://...
    resources:
      apps:
        agent_langgraph_advanced:
          name: agent-langgraph-advanced
